name: release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions: {}
# Never run two releases at once (they would compute the same next tag).
# Queued runs are not cancelled; the newest pending run covers every commit
# since the last tag anyway.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Reuse the test workflow: the release job only starts when it succeeded.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  release:
    needs: test
    # A manual run from another branch must never tag.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # default_bump patch would otherwise tag a commit that is already
      # released (e.g. a manual re-run), so skip when HEAD carries a tag.
      - name: Check whether HEAD is already tagged
        id: head
        run: |
          if tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "HEAD is already released as $tag, nothing to do."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute and push the next tag
        id: tag
        if: steps.head.outputs.tagged == 'false'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          release_branches: master
          custom_release_rules: >-
            feat:minor:Features,fix:patch:Bug Fixes,perf:patch:Performance,revert:patch:Reverts,refactor:patch:Refactoring,docs:patch:Documentation,chore:patch:Chores,ci:patch:CI,test:patch:Tests,build:patch:Build
      # Also recovers a tag whose release creation failed on an earlier run.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag || steps.head.outputs.tag }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          if [ -z "$NEW_TAG" ]; then
            echo "No tag, nothing to release."
            exit 0
          fi
          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists."
            exit 0
          fi
          if [ -n "$CHANGELOG" ]; then
            # GitHub caps release notes at ~125k characters.
            printf '%s\n' "$CHANGELOG" | head -c 100000 |
              gh release create "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "$NEW_TAG" --notes-file -
          else
            gh release create "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$NEW_TAG" --generate-notes
          fi
